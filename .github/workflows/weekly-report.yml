name: Weekly Status Report

on:
  schedule:
    # Every Monday 8:00 AM NZST = Sunday 20:00 UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Ensure status-report label exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = { name: 'status-report', color: '0284c7', description: 'Weekly automated status report' };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                console.log(`Created label: ${label.name}`);
              } catch (createError) {
                // Another workflow invocation may have created it between the GET and POST.
                if (createError.status !== 422) throw createError;
              }
            }

      - name: Check for existing report this week
        id: check-existing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const dow = now.getUTCDay();
            const diff = dow === 0 ? -6 : 1 - dow;
            const monday = new Date(now);
            monday.setUTCDate(now.getUTCDate() + diff);
            const weekOf = monday.toISOString().split('T')[0];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'status-report',
              per_page: 100,
            });

            const duplicate = issues.find(issue => issue.title.includes(`Week of ${weekOf}`));
            if (duplicate) {
              console.log(`Report for week of ${weekOf} already exists — #${duplicate.number}`);
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
              core.setOutput('week_of', weekOf);
            }

      - name: Gather weekly stats
        id: stats
        if: steps.check-existing.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceIso = since.toISOString();
            let incidentCount = 0;
            let recoveryCount = 0;

            for (const label of ['health-check', 'deployment']) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                labels: label,
                since: sinceIso,
                per_page: 100,
              });
              incidentCount += issues.filter(issue => new Date(issue.created_at) >= since).length;
              recoveryCount += issues.filter(issue =>
                issue.state === 'closed' && issue.closed_at && new Date(issue.closed_at) >= since
              ).length;
            }

            const { data: allOpen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const openCount = allOpen.filter(issue =>
              !issue.labels.some(label => label.name === 'status-report')
            ).length;

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              since: sinceIso,
              per_page: 100,
            });

            const totalChecks = 2016;
            const failedChecks = incidentCount * 3;
            const uptimePct = Math.max(0, ((totalChecks - failedChecks) / totalChecks * 100)).toFixed(2);
            core.setOutput('incident_count', String(incidentCount));
            core.setOutput('recovery_count', String(recoveryCount));
            core.setOutput('open_count', String(openCount));
            core.setOutput('deploy_count', String(commits.length));
            core.setOutput('uptime_pct', uptimePct);

      - name: Open weekly status report issue
        if: steps.check-existing.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const weekOf = `${{ steps.check-existing.outputs.week_of }}`;
            const incidents = Number.parseInt(`${{ steps.stats.outputs.incident_count }}`, 10);
            const recoveries = Number.parseInt(`${{ steps.stats.outputs.recovery_count }}`, 10);
            const openIssues = Number.parseInt(`${{ steps.stats.outputs.open_count }}`, 10);
            const deployments = Number.parseInt(`${{ steps.stats.outputs.deploy_count }}`, 10);
            const uptime = `${{ steps.stats.outputs.uptime_pct }}`;
            const recommendation = incidents > 0
              ? `💡 **Recommendation:** ${incidents} incident(s) detected this week. Review the [health-check issues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=label%3Ahealth-check) and investigate the root cause.`
              : '💡 **Recommendation:** No incidents this week. The site is running smoothly. Keep an eye on deployment frequency and response times.';

            const body = [
              `## 📊 Weekly Status Report — Week of ${weekOf}`,
              '', `*Automated report generated on ${new Date().toISOString()}*`, '', '---', '',
              '### ✅ Services Checked', '| URL | Description |', '|-----|-------------|',
              '| https://cogwanzfot.com | Home page |',
              '| https://cogwanzfot.com/auth/signin | Sign-in page |',
              '| https://cogwanzfot.com/register | Registration form |',
              '| https://cogwanzfot.com/auth/signup | Sign-up page |', '',
              '### 🚨 Incidents This Week', `**${incidents}** incident(s) opened  |  **${recoveries}** resolved`, '',
              '### 🔄 Deployments This Week', `**${deployments}** push(es) to \`main\``, '',
              '### 📋 Open Issues', `**${openIssues}** open issue(s) in the repository`, '',
              '### 📈 Estimated Uptime', `**${uptime}%** (based on health-check frequency of every 5 minutes)`, '',
              '---', '', recommendation, '', '---', '',
              '*This report is generated automatically every Monday at 8:00 AM NZST.*',
              `*To view past reports: [status-report issues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=label%3Astatus-report)*`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Status Report — Week of ${weekOf}`,
              body,
              labels: ['status-report'],
            });
            console.log(`Opened weekly status report for week of ${weekOf}`);
