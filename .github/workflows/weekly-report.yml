name: Weekly Status Report

on:
  schedule:
    # Every Monday 8:00 AM NZST = Sunday 20:00 UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Ensure status-report label exists
        uses: actions/github-script@v7
        with:
          script: |
            const label = { name: 'status-report', color: '0284c7', description: 'Weekly automated status report' };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name:  label.name,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  name:        label.name,
                  color:       label.color,
                  description: label.description,
                });
                console.log(`Created label: ${label.name}`);
              }
            }

      - name: Check for existing report this week
        id: check-existing
        uses: actions/github-script@v7
        with:
          script: |
            const now    = new Date();
            // ISO week start (Monday)
            const dow    = now.getUTCDay(); // 0=Sun … 6=Sat
            const diff   = dow === 0 ? -6 : 1 - dow;
            const monday = new Date(now);
            monday.setUTCDate(now.getUTCDate() + diff);
            const weekOf = monday.toISOString().split('T')[0];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              state:  'open',
              labels: 'status-report',
            });

            const dup = issues.find(i => i.title.includes(`Week of ${weekOf}`));
            if (dup) {
              console.log(`Report for week of ${weekOf} already exists — #${dup.number}`);
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip',    'false');
              core.setOutput('week_of', weekOf);
            }

      - name: Gather weekly stats
        id: stats
        if: steps.check-existing.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date();
            since.setUTCDate(since.getUTCDate() - 7);
            const sinceIso = since.toISOString();

            // Issues opened in past 7 days with health-check or deployment label
            let incidentCount = 0;
            let recoveryCount = 0;

            for (const label of ['health-check', 'deployment']) {
              // opened
              const { data: opened } = await github.rest.issues.listForRepo({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                state:  'all',
                labels: label,
                since:  sinceIso,
              });
              incidentCount += opened.filter(i => new Date(i.created_at) >= since).length;

              // closed
              const closed = opened.filter(
                i => i.state === 'closed' && i.closed_at && new Date(i.closed_at) >= since
              );
              recoveryCount += closed.length;
            }

            // Total open issues
            const { data: allOpen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
            });
            // Exclude status-report issues from count
            const openCount = allOpen.filter(i => !i.labels.find(l => l.name === 'status-report')).length;

            // Deployments (pushes to main) in past 7 days
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   'main',
              since: sinceIso,
              per_page: 100,
            });
            const deployCount = commits.length;

            // Simple uptime estimate
            // Assume checks run every 5 min = 2016 checks/week
            const totalChecks = 2016;
            const failedChecks = incidentCount * 3; // rough estimate: each incident = ~3 failed checks
            const uptimePct = Math.max(0, ((totalChecks - failedChecks) / totalChecks * 100)).toFixed(2);

            core.setOutput('incident_count', String(incidentCount));
            core.setOutput('recovery_count', String(recoveryCount));
            core.setOutput('open_count',     String(openCount));
            core.setOutput('deploy_count',   String(deployCount));
            core.setOutput('uptime_pct',     uptimePct);

      - name: Open weekly status report issue
        if: steps.check-existing.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const weekOf       = `${{ steps.check-existing.outputs.week_of }}`;
            const incidents    = parseInt(`${{ steps.stats.outputs.incident_count }}`, 10);
            const recoveries   = parseInt(`${{ steps.stats.outputs.recovery_count }}`, 10);
            const openIssues   = parseInt(`${{ steps.stats.outputs.open_count }}`, 10);
            const deployments  = parseInt(`${{ steps.stats.outputs.deploy_count }}`, 10);
            const uptime       = `${{ steps.stats.outputs.uptime_pct }}`;

            const recommendation = incidents > 0
              ? `💡 **Recommendation:** ${incidents} incident(s) detected this week. Review the [health-check issues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=label%3Ahealth-check) and consider investigating the root cause to prevent future outages.`
              : `💡 **Recommendation:** No incidents this week. The site is running smoothly. Keep an eye on deployment frequency and response times.`;

            const body = [
              `## 📊 Weekly Status Report — Week of ${weekOf}`,
              ``,
              `*Automated report generated on ${new Date().toISOString()}*`,
              ``,
              `---`,
              ``,
              `### ✅ Services Checked`,
              `| URL | Description |`,
              `|-----|-------------|`,
              `| https://cogwanzfot.com | Home page |`,
              `| https://cogwanzfot.com/auth/signin | Sign-in page |`,
              `| https://cogwanzfot.com/register | Registration form |`,
              `| https://cogwanzfot.com/auth/signup | Sign-up page |`,
              ``,
              `### 🚨 Incidents This Week`,
              `**${incidents}** incident(s) opened  |  **${recoveries}** resolved`,
              ``,
              `### 🔄 Deployments This Week`,
              `**${deployments}** push(es) to \`main\``,
              ``,
              `### 📋 Open Issues`,
              `**${openIssues}** open issue(s) in the repository`,
              ``,
              `### 📈 Estimated Uptime`,
              `**${uptime}%** (based on health-check frequency of every 5 minutes)`,
              ``,
              `---`,
              ``,
              recommendation,
              ``,
              `---`,
              ``,
              `*This report is generated automatically every Monday at 8:00 AM NZST.*`,
              `*To view past reports: [status-report issues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=label%3Astatus-report)*`,
            ].join('\n');

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `📊 Weekly Status Report — Week of ${weekOf}`,
              body,
              labels: ['status-report'],
            });
            console.log(`Opened weekly status report for week of ${weekOf}`);
