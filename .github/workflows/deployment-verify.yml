name: Deployment Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      statuses: write

    steps:
      - name: Wait for Vercel to deploy
        if: github.event_name == 'push'
        run: |
          echo "Waiting 3 minutes for Vercel to deploy..."
          sleep 180

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = [
              { name: 'deployment', color: '7c3aed', description: 'Deployment verification alert' },
              { name: 'bug', color: 'd73a4a', description: 'Something is not working' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  console.log(`Created label: ${label.name}`);
                } catch (createError) {
                  // A concurrent run may have created the label after the GET.
                  if (createError.status !== 422) throw createError;
                }
              }
            }

      - name: Run deployment health checks
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          declare -A PAGES=(
            [home]="https://cogwanzfot.com"
            [signin]="https://cogwanzfot.com/auth/signin"
            [register]="https://cogwanzfot.com/register"
            [signup]="https://cogwanzfot.com/auth/signup"
          )

          WARN_MS=3000
          FAIL_MS=8000
          FAILURES=""
          ALL_RESULTS=""

          for PAGE in home signin register signup; do
            URL="${PAGES[$PAGE]}"
            BODY="/tmp/body_${PAGE}.html"
            RESULT="$(curl --max-time 10 --connect-timeout 5 -o "$BODY" -sS -w '%{http_code} %{time_total}' "$URL" 2>/tmp/curl_${PAGE}.err)"
            CURL_EXIT=$?

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "[$PAGE] curl failed with exit code $CURL_EXIT"
              RESULT="000 0"
            fi

            HTTP_CODE="${RESULT%% *}"
            TIME_TOTAL="${RESULT#* }"
            TIME_MS="$(awk -v seconds="${TIME_TOTAL:-0}" 'BEGIN { printf "%d", seconds * 1000 }')"
            STATUS="✅ OK"

            if [ "$HTTP_CODE" != "200" ]; then
              STATUS="❌ FAILED (HTTP $HTTP_CODE)"
              FAILURES+=$'\n'"- **$PAGE** ($URL): HTTP $HTTP_CODE, ${TIME_MS}ms"
            elif [ "$TIME_MS" -ge "$FAIL_MS" ]; then
              STATUS="❌ SLOW (${TIME_MS}ms)"
              FAILURES+=$'\n'"- **$PAGE** ($URL): Response too slow (${TIME_MS}ms ≥ ${FAIL_MS}ms)"
            elif [ "$TIME_MS" -ge "$WARN_MS" ]; then
              STATUS="⚠️ SLOW (${TIME_MS}ms)"
            fi

            ALL_RESULTS+=$'\n'"| $PAGE | $URL | $HTTP_CODE | ${TIME_MS}ms | $STATUS |"
            echo "[$PAGE] $URL => HTTP $HTTP_CODE, ${TIME_MS}ms => $STATUS"
          done

          if [ -f /tmp/body_home.html ] && ! grep -qi '<html' /tmp/body_home.html; then
            FAILURES+=$'\n''- **home** (https://cogwanzfot.com): Response does not contain <html tag'
            echo "Home page missing <html tag ❌"
          fi

          if [ -f /tmp/body_signin.html ] && ! grep -qi 'sign' /tmp/body_signin.html; then
            FAILURES+=$'\n''- **signin** (https://cogwanzfot.com/auth/signin): Page does not contain expected sign-in content'
            echo "Sign-in page missing expected content ❌"
          fi

          {
            echo 'failures<<EOF'
            printf '%s\n' "$FAILURES"
            echo 'EOF'
            echo 'results<<EOF'
            printf '%s\n' "$ALL_RESULTS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FAILURES" ]; then
            echo 'any_failure=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any_failure=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Post success commit status
        if: steps.checks.outputs.any_failure == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: '✅ Deployment healthy',
              context: 'Deployment Verification',
            });

      - name: Post failure commit status and open issue
        if: steps.checks.outputs.any_failure == 'true'
        uses: actions/github-script@v7
        env:
          FAILURES: ${{ steps.checks.outputs.failures }}
          RESULTS: ${{ steps.checks.outputs.results }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failures = process.env.FAILURES || '- No failure details captured.';
            const results = process.env.RESULTS || '| No results captured | | | | |';
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let commitMessage = '(unknown)';
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              commitMessage = commit.commit.message.split('\n')[0];
            } catch (error) {
              console.log('Could not fetch commit message:', error.message);
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              description: '❌ Deployment verification failed',
              context: 'Deployment Verification',
              target_url: runUrl,
            });

            const body = [
              '## 🚨 Deployment Verification Failed',
              '',
              '@reversesingularity',
              '',
              `**Commit:** [\`${shortSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha})`,
              `**Message:** ${commitMessage}`,
              `**Workflow run:** ${runUrl}`,
              '',
              '### Failed checks',
              failures,
              '',
              '### Full results',
              '| Page | URL | HTTP | Time | Status |',
              '|------|-----|------|------|--------|',
              results,
              '',
              '### Next steps',
              `- Review the [workflow run](${runUrl}) for full logs`,
              '- Check [Vercel deployment logs](https://vercel.com) for build errors',
              '- Inspect the [live site](https://cogwanzfot.com) manually',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment Verification Failed — ${shortSha}`,
              body,
              labels: ['deployment', 'bug'],
            });
