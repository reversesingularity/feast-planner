AWSTemplateFormatVersion: '2010-09-09'
Description: 'Feast Planner - Cognito Identity Pool and DynamoDB Setup'

Parameters:
  UserPoolId:
    Type: String
    Default: ap-southeast-2_ygAo9qN61
    Description: Existing Cognito User Pool ID
  
  UserPoolClientId:
    Type: String
    Default: 45c8arrc3ro16kdtvs40figkm3
    Description: Existing Cognito User Pool App Client ID
  
  DynamoDBTableName:
    Type: String
    Default: feast-planner-trips
    Description: Name for the DynamoDB table

Resources:
  # DynamoDB Table for Trips
  TripsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: tripId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: FeastPlanner
        - Key: Environment
          Value: Production
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Cognito Identity Pool
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: feast-planner-identity-pool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClientId
          ProviderName: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'

  # IAM Role for Authenticated Users
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FeastPlanner-Cognito-AuthRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
      Policies:
        - PolicyName: FeastPlannerDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt TripsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - '${cognito-identity.amazonaws.com:sub}'

  # Attach Roles to Identity Pool
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: Cognito Identity Pool ID (add to .env.local as VITE_AWS_IDENTITY_POOL_ID)
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'
  
  DynamoDBTableName:
    Description: DynamoDB Table Name (add to .env.local as VITE_DYNAMODB_TABLE_NAME)
    Value: !Ref TripsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  
  DynamoDBTableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt TripsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
  
  AuthRoleArn:
    Description: IAM Role ARN for authenticated users
    Value: !GetAtt CognitoAuthenticatedRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuthRoleArn'
  
  Region:
    Description: AWS Region (add to .env.local as VITE_AWS_REGION)
    Value: !Ref AWS::Region
