AWSTemplateFormatVersion: '2010-09-09'
Description: 'COGWA NZ Feast of Tabernacles - Registration System Infrastructure'

Parameters:
  UserPoolId:
    Type: String
    Default: ap-southeast-2_ygAo9qN61
    Description: Existing Cognito User Pool ID
  
  UserPoolClientId:
    Type: String
    Default: 45c8arrc3ro16kdtvs40figkm3
    Description: Existing Cognito User Pool App Client ID
  
  RegistrationTableName:
    Type: String
    Default: feast-registration-nz
    Description: DynamoDB table for household registrations (PK=userId, SK=sk)

Resources:
  # DynamoDB Table — single-table design
  # PK: userId (Cognito identityId)
  # SK: "HOUSEHOLD" | "MEMBER#<uuid>" | "VOLUNTEER"
  RegistrationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RegistrationTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: FeastPlanner
        - Key: Environment
          Value: Production
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Cognito Identity Pool — issues temporary AWS credentials to logged-in users
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: feast-planner-identity-pool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClientId
          ProviderName: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'

  # IAM Role for Authenticated Users
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FeastPlanner-Cognito-AuthRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: FeastRegistrationDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Row-level access: users can only read/write their own records
              - Sid: OwnRecordsAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt RegistrationTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - '${cognito-identity.amazonaws.com:sub}'
              # Admin Scan: any authenticated user can call Scan
              # (application-level admin check enforced in the SvelteKit admin page)
              - Sid: AdminScanAccess
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt RegistrationTable.Arn

  # Attach role to Identity Pool
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: >
      Cognito Identity Pool ID.
      Add to .env.local as: VITE_AWS_IDENTITY_POOL_ID=<value>
      Also add to Vercel project environment variables.
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'
  
  RegistrationTableName:
    Description: >
      DynamoDB table name.
      Add to .env.local as: VITE_REGISTRATION_TABLE_NAME=<value>
    Value: !Ref RegistrationTable
    Export:
      Name: !Sub '${AWS::StackName}-RegistrationTableName'
  
  RegistrationTableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt RegistrationTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RegistrationTableArn'
  
  AuthRoleArn:
    Description: IAM Role ARN for authenticated users
    Value: !GetAtt CognitoAuthenticatedRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuthRoleArn'
  
  Region:
    Description: AWS Region (VITE_AWS_REGION)
    Value: !Ref AWS::Region
